# Netlify deploy settings — static site, no build step.
# Netlify redeploys automatically on every push to main.

[build]
  publish = "."
  # Strip repo-only files so they aren't publicly served
  command = "rm -rf CLAUDE.md .github netlify.toml"

# Long-cache images and icons; HTML/CSS/JS revalidate so edits show up right away
[[headers]]
  for = "/Images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
